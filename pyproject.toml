[project]
name = "coin-wargame-mcp"
version = "0.1.0"
description = "MCP server over the Mauritania COIN wargame engine: any host model plays Government or Red Team through tools; seeded, replayable games; an MCP-client benchmark harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
bench = [
    "anthropic>=0.40.0",
]

[project.scripts]
coin-wargame-mcp = "coin_wargame_mcp.server:main"
coin-bench = "bench.__main__:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coin_wargame_mcp", "bench"]
